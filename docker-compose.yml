services:
  newsfeed:
    build: .
    image: newsfeed:latest
    container_name: newsfeed
    restart: unless-stopped
    ports:
      # Nur lokal erreichbar (Port 8090, da 8080 oft schon belegt ist) – nach außen (HTTPS) über "tailscale serve".
      - "127.0.0.1:8090:8080"
    volumes:
      - newsfeed-data:/data
      - ./config:/app/config:ro
    environment:
      # Wird ab Schritt 2 (Clustering/Ranking) verwendet.
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  newsfeed-data:
